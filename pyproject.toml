[project]
name = "market-data-ingestion"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11,<3.13"

authors = [
  { name = "joaobarreto27", email = "joao.vito1951@gmail.com" }
]
dependencies = [
    "boto3 (>=1.42.79,<2.0.0)",
    "botocore[crt] (>=1.42.79,<2.0.0)",
    "streamlit (>=1.30.0,<2.0.0)",
    "pyarrow (>=17,<18)",
    "pandas (>=2.0.0,<3.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "watchdog (>=6.0.0,<7.0.0)"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "B", "I", "D"]
ignore = ["D100", "D103", "D104", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
files = ["src"]
namespace_packages = true
ignore_missing_imports = true

[tool.taskipy.tasks]
format = "ruff format ."
fix = "ruff check . --fix"
commit = "pre-commit run --all-files"
typecheck = "mypy src"
security = "bandit -r src -s B101"
audit = "pip-audit"
ci = """
task format
task fix
task typecheck
task security
task audit
task commit
"""

[project.optional-dependencies]
dev = [
    "ruff (>=0.15.8,<0.16.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "pre-commit (>=4.5.1,<5.0.0)",
    "pip-audit (>=2.10.0,<3.0.0)",
    "bandit (>=1.9.4,<2.0.0)"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
